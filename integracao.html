<!-- AVALIAÇÃO -->
<section style="
margin-top:60px;
background:#f5f5f5;
padding:30px;
border-left:6px solid #f2b705;
border-radius:8px;
">

<h2 style="margin-top:0;">
📝 Avaliação de Integração
</h2>

<input type="text"
id="nome"
placeholder="Nome Completo"

style="
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
">

<input type="text"
id="funcao"
placeholder="Função"

style="
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
">

<input type="text"
id="cpf"
placeholder="CPF"

style="
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
">

<label style="font-size:16px;">

<input type="checkbox"
id="declaracao">

Declaro que realizei este treinamento.

</label>

<br><br>

<h3>Perguntas</h3>

<!-- 1 -->
<div style="
background:#eeeeee;
padding:20px;
margin-bottom:20px;
border-radius:8px;
border-left:5px solid #f2b705;
">

<p style="font-weight:bold;">
1. A segurança do trabalho é:
</p>

<label>
<input type="radio" name="q1" value="certo">
Prioridade da empresa
</label>

<br>

<label>
<input type="radio" name="q1" value="errado">
Opcional
</label>

</div>

<!-- 2 -->
<div style="
background:#eeeeee;
padding:20px;
margin-bottom:20px;
border-radius:8px;
border-left:5px solid #f2b705;
">

<p style="font-weight:bold;">
2. O colaborador deve:
</p>

<label>
<input type="radio" name="q2" value="certo">
Utilizar EPIs corretamente
</label>

<br>

<label>
<input type="radio" name="q2" value="errado">
Ignorar procedimentos
</label>

</div>

<!-- 3 -->
<div style="
background:#eeeeee;
padding:20px;
margin-bottom:20px;
border-radius:8px;
border-left:5px solid #f2b705;
">

<p style="font-weight:bold;">
3. A empresa atua conforme:
</p>

<label>
<input type="radio" name="q3" value="certo">
Normas e legislações
</label>

<br>

<label>
<input type="radio" name="q3" value="errado">
Sem regras
</label>

</div>

<!-- 4 -->
<div style="
background:#eeeeee;
padding:20px;
margin-bottom:20px;
border-radius:8px;
border-left:5px solid #f2b705;
">

<p style="font-weight:bold;">
4. Sustentabilidade significa:
</p>

<label>
<input type="radio" name="q4" value="certo">
Respeito ao meio ambiente
</label>

<br>

<label>
<input type="radio" name="q4" value="errado">
Desperdício de recursos
</label>

</div>

<!-- 5 -->
<div style="
background:#eeeeee;
padding:20px;
margin-bottom:20px;
border-radius:8px;
border-left:5px solid #f2b705;
">

<p style="font-weight:bold;">
5. O colaborador deve comunicar:
</p>

<label>
<input type="radio" name="q5" value="certo">
Situações de risco
</label>

<br>

<label>
<input type="radio" name="q5" value="errado">
Nada ao supervisor
</label>

</div>

<button onclick="corrigir()"

style="
background:#f2b705;
color:#000;
padding:14px 25px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:16px;
">

Finalizar Avaliação

</button>

<p id="resultado"
style="
font-weight:bold;
font-size:22px;
margin-top:20px;
">
</p>

</section>

<script>

function corrigir(){

let nome =
document.getElementById("nome").value;

let funcao =
document.getElementById("funcao").value;

let cpf =
document.getElementById("cpf").value;

let declaracao =
document.getElementById("declaracao").checked;

if(nome === "" || funcao === "" || cpf === ""){

alert("Preencha todos os dados!");

return;

}

if(!declaracao){

alert("Confirme a declaração!");

return;

}

let respostas =
document.querySelectorAll(
'input[type="radio"]:checked'
);

if(respostas.length < 5){

alert("Responda todas as perguntas!");

return;

}

let pontos = 0;

respostas.forEach(r => {

if(r.value === "certo"){

pontos++;

}

});

let resultado =
document.getElementById("resultado");

if(pontos >= 4){

resultado.innerHTML =
"✅ Aprovado";

resultado.style.color =
"green";

/* SALVAR PLANILHA */

fetch("https://script.google.com/macros/s/AKfycbz70yDtVnHaOK0pHAh94FWLiX58mmikKsW0cuulbH7BCAXSAyJV_BgeN3oWPGAr4DEBxg/exec", {

method: "POST",

body: JSON.stringify({

nome: nome,
funcao: funcao,
cpf: cpf,
nr: "INTEGRAÇÃO",
nota: pontos

})

});

}else{

resultado.innerHTML =
"❌ Reprovado";

resultado.style.color =
"red";

}

}

</script>
